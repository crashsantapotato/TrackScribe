name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements/ci.txt

      - name: Compile source
        run: python -m compileall -q pipeline.py ui.py trackscribe integration_tests ui_tests scripts/check_release_hygiene.py

      - name: Backend unit tests
        run: python -m unittest discover -s trackscribe -p "*_test.py" -v

      - name: Bridge and REAPER tests
        run: python -m unittest discover -s integration_tests -p "*_test.py" -v

      - name: Qt UI tests
        run: python -m unittest discover -s ui_tests -p "*_test.py" -v

      - name: Repository hygiene
        run: python scripts/check_release_hygiene.py
